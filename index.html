<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Seismic Calculator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

.result{
    font-weight:bold;
}

</style>

</head>

<body>

<h1>Seismic Calculator</h1>

<div class="card">

<h3>Upload PDF</h3>

<input type="file" id="pdfFile" accept=".pdf">

<button onclick="readPDF()">Process PDF</button>

</div>

<div class="card">

<h3>Extracted Parameters</h3>

<table>

<tr>
<td>Site Class</td>
<td id="siteClass"></td>
</tr>

<tr>
<td>SS</td>
<td id="ss"></td>
</tr>

<tr>
<td>S1</td>
<td id="s1"></td>
</tr>

</table>

</div>

<div class="card">

<h3>Calculated Seismic Parameters</h3>

<table>

<tr>
<td>Fa</td>
<td id="fa"></td>
</tr>

<tr>
<td>Fv</td>
<td id="fv"></td>
</tr>

<tr>
<td>SMS</td>
<td id="sms"></td>
</tr>

<tr>
<td>SM1</td>
<td id="sm1"></td>
</tr>

<tr>
<td>SDS</td>
<td id="sds"></td>
</tr>

<tr>
<td>SD1</td>
<td id="sd1"></td>
</tr>

</table>

</div>

<script>

const faTable = {

SA:[0.8,0.8,0.8,0.8,0.8,0.8],
SB:[0.9,0.9,0.9,0.9,0.9,0.9],
SC:[1.3,1.3,1.2,1.2,1.2,1.2],
SD:[1.6,1.4,1.2,1.1,1.0,1.0],
SE:[2.4,1.7,1.3,1.1,0.9,0.8]

};

const ssPoints=[0.25,0.50,0.75,1.00,1.25,1.50];

const fvTable = {

SA:[0.8,0.8,0.8,0.8,0.8,0.8],
SB:[0.8,0.8,0.8,0.8,0.8,0.8],
SC:[1.5,1.5,1.5,1.5,1.5,1.4],
SD:[2.4,2.2,2.0,1.9,1.8,1.7],
SE:[4.2,3.3,2.8,2.4,2.2,2.0]

};

const s1Points=[0.10,0.20,0.30,0.40,0.50,0.60];

function interpolate(x,x1,y1,x2,y2){

return y1 + (x-x1)*(y2-y1)/(x2-x1);

}

function lookupFa(siteClass,ss){

const values = faTable[siteClass];

if(ss<=ssPoints[0]) return values[0];
if(ss>=ssPoints[5]) return values[5];

for(let i=0;i<ssPoints.length-1;i++){

if(ss>=ssPoints[i] && ss<=ssPoints[i+1]){

return interpolate(
ss,
ssPoints[i],
values[i],
ssPoints[i+1],
values[i+1]
);

}

}

}

function lookupFv(siteClass,s1){

const values = fvTable[siteClass];

if(s1<=s1Points[0]) return values[0];
if(s1>=s1Points[5]) return values[5];

for(let i=0;i<s1Points.length-1;i++){

if(s1>=s1Points[i] && s1<=s1Points[i+1]){

return interpolate(
s1,
s1Points[i],
values[i],
s1Points[i+1],
values[i+1]
);

}

}

}

async function readPDF(){

const file=document.getElementById("pdfFile").files[0];

if(!file){

alert("Please select PDF");
return;

}

const buffer=await file.arrayBuffer();

const pdf=await pdfjsLib.getDocument(buffer).promise;

let text="";

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i);

const content=await page.getTextContent();

text += content.items.map(x=>x.str).join(" ");

}

extractValues(text);

}

function extractValues(text){

const ssMatch=text.match(/SS\s*MCE[rR]\s*([0-9.]+)/i);
const s1Match=text.match(/S1\s*MCE[rR]\s*([0-9.]+)/i);

let siteClass="SE";

if(text.includes("SA")) siteClass="SA";
if(text.includes("SB")) siteClass="SB";
if(text.includes("SC")) siteClass="SC";
if(text.includes("SD")) siteClass="SD";
if(text.includes("SE")) siteClass="SE";

const ss=ssMatch ? parseFloat(ssMatch[1]) : 0;
const s1=s1Match ? parseFloat(s1Match[1]) : 0;

document.getElementById("siteClass").innerHTML=siteClass;
document.getElementById("ss").innerHTML=ss.toFixed(4);
document.getElementById("s1").innerHTML=s1.toFixed(4);

calculate(siteClass,ss,s1);

}

function calculate(siteClass,ss,s1){

const Fa=lookupFa(siteClass,ss);
const Fv=lookupFv(siteClass,s1);

const SMS=Fa*ss;
const SM1=Fv*s1;

const SDS=(2/3)*SMS;
const SD1=(2/3)*SM1;

document.getElementById("fa").innerHTML=Fa.toFixed(3);
document.getElementById("fv").innerHTML=Fv.toFixed(3);

document.getElementById("sms").innerHTML=SMS.toFixed(3);
document.getElementById("sm1").innerHTML=SM1.toFixed(3);

document.getElementById("sds").innerHTML=SDS.toFixed(3);
document.getElementById("sd1").innerHTML=SD1.toFixed(3);

}

</script>

</body>
</html>
